# The ambient X display for the Linux CI jobs: an Xorg server on the dummy
# video driver, run as the runner user with no VT and no input devices. Unlike
# Xvfb it has real RandR CRTCs with several modes and gamma ramps, so the
# display-changing tests (BRODISPLAYS_TEST_MUTATE=1) have something to change.
# The same configuration test_linux_night_light_x11 writes for its private
# server (tests/linux/private_session.cpp).
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
EndSection
Section "Monitor"
    Identifier "Monitor0"
    HorizSync 5.0 - 1000.0
    VertRefresh 5.0 - 200.0
    Modeline "1920x1080_60" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
    Modeline "1280x1024_60" 109.00 1280 1368 1496 1712 1024 1027 1034 1063 -hsync +vsync
EndSection
Section "Device"
    Identifier "Card0"
    Driver "dummy"
    VideoRam 256000
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    Monitor "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080_60" "1280x1024_60"
        Virtual 1920 1080
    EndSubSection
EndSection
